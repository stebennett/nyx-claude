name: plugins

# Structural validation of every plugin in the marketplace. See
# scripts/check-plugin.sh for what is checked; CLAUDE.md for why.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-plugin:
    name: check-plugin.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate every plugin
        run: |
          # Run all plugins before failing, so one CI run reports every broken
          # plugin rather than only the first.
          fail=0
          for p in plugins/*/; do
            echo "::group::$p"
            bash scripts/check-plugin.sh "$p" || fail=1
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::one or more plugins failed structural validation"
            exit 1
          fi

  script-tests:
    name: script tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Run every plugin's script tests
        run: |
          # Both platforms matter: this repo targets bash 3.2 (macOS default)
          # and forbids GNU-only constructs, so a Linux-only run would hide
          # exactly the breakage that rule exists to prevent.
          fail=0
          found=0
          for t in plugins/*/scripts/tests/*.sh; do
            [ -f "$t" ] || continue
            found=1
            echo "::group::$t"
            bash "$t" || fail=1
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no script tests were found — the glob is wrong"
            exit 1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "::error::one or more script tests failed"
            exit 1
          fi
